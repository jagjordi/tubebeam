name: Release

# Push a tag like v0.1.0 to build a signed APK and attach it to a GitHub Release.
# Requires repository secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          TUBEBEAM_KEYSTORE: ${{ runner.temp }}/release.keystore
          TUBEBEAM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TUBEBEAM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TUBEBEAM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew test assembleRelease --no-daemon \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "tubebeam-${GITHUB_REF_NAME}.apk"
          sha256sum "tubebeam-${GITHUB_REF_NAME}.apk" > "tubebeam-${GITHUB_REF_NAME}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "TubeBeam $GITHUB_REF_NAME" \
            --generate-notes \
            "tubebeam-${GITHUB_REF_NAME}.apk" "tubebeam-${GITHUB_REF_NAME}.apk.sha256"
